name: FaroSocial · GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application
        run: |
          npm test
          node --check assets/app.js
          node --check assets/cloud.js
          node --check assets/admin.js
          node --check assets/editor.js
          node --check assets/queue.js
          node --check assets/queue-core.js
          node --check assets/media.js
          node --check assets/media-core.js
          node --check assets/editor-core.js
          node --check assets/cloud-core.js
          node --check assets/cloud-config.js
          node --check server/index.mjs
          node --check server/youtube.mjs
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp -R precios login registro app _site/
          cp assets/marketing.css _site/assets/
          node --check neon/server/preview-client.mjs
          node --check neon/server/access-client.mjs
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
